name: Publish R48 build as index.html
on:
  push:
    paths:
      - .github/workflows/publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with uploaded build and remove workflow
        run: |
          mv stairs-upload-index.html index.html
          rm .github/workflows/publish.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish STAIRS REMAKE 48 build as index.html"
          git push
