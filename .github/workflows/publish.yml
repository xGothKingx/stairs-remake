name: Publish R47 build as index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with R47 build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          mv -f stairs-upload-index.html index.html
          git rm -r .github
          git add -A
          git commit -m "Publish STAIRS REMAKE 47 build as index.html"
          git push
