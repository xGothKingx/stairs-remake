name: Rename game file to index.html
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename stairs-remake.html to index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git mv stairs-remake.html index.html
          git rm -r .github
          git commit -m "Rename stairs-remake.html to index.html"
          git push
