name: Publish R49
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with R49 build and remove this workflow
        run: |
          mv stairs-upload-index.html index.html
          rm -f .github/workflows/publish-r49.yml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish STAIRS REMAKE 49 build as index.html" || exit 0
          git push
