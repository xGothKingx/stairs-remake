name: Publish STAIRS REMAKE 63

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Replace index.html with new build and clean up
        run: |
          test -f stairs-remake.html
          mv stairs-remake.html index.html
          rm -f publish-r63.html
          rm -f .github/workflows/publish-63.yml
          rm -f .github/workflows/publish-51.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Publish STAIRS REMAKE 63 build as index.html"
          git push
